[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typingnorm"
version = "0.2.0"
description = "人類打字的常模，以及據此判斷輸入是否為真人的判準。每條判準的誤判率都在獨立資料集上量過。"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "MangoCore LLC" }]
keywords = ["keystroke-dynamics", "bot-detection", "typing", "liveness", "human-verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
desktop = ["pynput>=1.7"]          # 只有真的要驅動實體鍵盤時才需要
dev = ["pytest>=7", "jsonschema>=4.18"]   # 後者只用來驗 session_schema.json

[project.urls]
Homepage = "https://github.com/gba3124/typingnorm"
Source = "https://github.com/gba3124/typingnorm"
Method = "https://github.com/gba3124/typingnorm/blob/main/METHOD.md"

[tool.hatch.build.targets.wheel]
packages = ["src/typingnorm"]

# 常模的單一事實來源是 repo 根的 profile.json，Python 與 JS 都由它產生，
# 各自留一份遲早會走鐘。打包時才複製進 wheel。
[tool.hatch.build.targets.wheel.force-include]
"profile.json" = "typingnorm/profile.json"
"session_schema.json" = "typingnorm/session_schema.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
